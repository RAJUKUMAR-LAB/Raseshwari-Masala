<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Invoice - Raseshwari Foods Pvt. Ltd.</title>
  <link rel="icon" type="image/jpeg" href="https://lh3.googleusercontent.com/d/17_ILxbUAwr-_-HqExmbNXJlEyY3REHZR">
  <link rel="stylesheet" href="style.css?v=5.3">
  <style>
    body {
      background: #F1F5F9;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .invoice-view-header {
      background: #FFFFFF;
      padding: 14px 24px;
      border-bottom: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .invoice-view-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .invoice-view-brand img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
    }
    .invoice-view-brand h3 {
      margin: 0;
      font-size: 1.1rem;
      color: #991B1B;
      font-weight: 800;
    }
    .invoice-view-brand p {
      margin: 0;
      font-size: 0.8rem;
      color: #64748B;
    }
    .invoice-view-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .invoice-page-container {
      flex: 1;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .invoice-paper-wrapper {
      max-width: 820px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border-radius: 12px;
      overflow: hidden;
      background: #FFFFFF;
    }
    @media (max-width: 650px) {
      .invoice-view-header {
        padding: 10px 14px;
      }
      .invoice-view-actions .btn-text {
        display: none;
      }
      .invoice-view-actions button, .invoice-view-actions a {
        padding: 8px 12px !important;
      }
    }
  </style>
</head>
<body>

  <header class="invoice-view-header">
    <div class="invoice-view-brand">
      <img src="https://lh3.googleusercontent.com/d/17_ILxbUAwr-_-HqExmbNXJlEyY3REHZR" referrerpolicy="no-referrer" alt="Raseshwari Spices Logo">
      <div>
        <h3>RASESHWARI FOODS</h3>
        <p id="header-inv-sub">Official Retail Bill • GSTIN: 10REAPK9623A1ZS | Line 1: +91 99055 61443 | Line 2: +91 98356 54983</p>
      </div>
    </div>
    <div class="invoice-view-actions">
      <button type="button" class="btn-invoice-download" onclick="downloadPageInvoicePDF()" title="Print Official Bill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
        <span class="btn-text">Print Bill</span>
      </button>

      <a href="index.html" class="btn btn-secondary-guide" style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; background: #F1F5F9; color: #1E293B; border-radius: 8px; font-weight: 700;">
        <span>← Store</span>
      </a>
    </div>
  </header>

  <main class="invoice-page-container">
    <div class="invoice-paper-wrapper" id="invoice-target-container">
      <div style="padding: 40px; text-align: center; color: #64748B;">
        Loading Official Retail Invoice...
      </div>
    </div>
  </main>

  <footer style="text-align: center; padding: 20px 14px 28px; font-size: 0.82rem; color: #64748B;">
    <p style="margin: 0; line-height: 1.6;">
      &copy; 2026 <strong>Raseshwarimasala.com</strong> <span style="margin: 0 5px;">&bull;</span> <strong>Raseshwari Foods Pvt. Ltd.</strong> <span style="margin: 0 5px;">&bull;</span> All Rights Reserved
    </p>
  </footer>

  <script src="app.js?v=7.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let data = null;
      try {
        const saved = localStorage.getItem('raseshwari_last_invoice');
        if (saved) {
          data = JSON.parse(saved);
        }
      } catch (e) {
        console.error('Error parsing localStorage invoice', e);
      }

      if (!data) {
        data = {
          invoiceNo: 'RS-DEMO' + Math.floor(1000 + Math.random() * 9000),
          date: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }),
          name: 'Valued Customer',
          phone: '+91 99055 61443 / +91 98356 54983',
          gstin: '10REAPK9623A1ZS',
          flat: 'Main Bazaar',
          landmark: 'Gandhi Chowk',
          city: 'Sitamarhi',
          state: 'Bihar',
          pincode: '843302',
          fullAddress: 'Main Bazaar, Gandhi Chowk, Sitamarhi, Bihar - 843302',
          items: [
            { name: 'Haldi Powder (Turmeric)', weight: '500g', qty: 2, mrp: 150, price: 120, total: 240 },
            { name: 'Dhaniya Powder (Coriander)', weight: '500g', qty: 1, mrp: 160, price: 130, total: 130 },
            { name: 'Royal Garam Masala', weight: '100g', qty: 1, mrp: 110, price: 85, total: 85 }
          ],
          subtotal: 455,
          savings: 75,
          deliveryFee: 0,
          grandTotal: 455
        };
      }

      window.lastOrderInvoiceData = data;
      const container = document.getElementById('invoice-target-container');
      if (container) {
        if (typeof buildCleanPrintableInvoiceHTML === 'function') {
          container.innerHTML = buildCleanPrintableInvoiceHTML(data);
        } else if (typeof buildInvoiceHTML === 'function') {
          container.innerHTML = buildInvoiceHTML(data);
        }
      }
      const sub = document.getElementById('header-inv-sub');
      if (sub) sub.textContent = `Invoice: ${data.invoiceNo} | Date: ${data.date}`;
    });

    function downloadPageInvoicePDF() {
      if (typeof downloadCurrentInvoicePDF === 'function') {
        if (typeof printCurrentInvoice === 'function') { printCurrentInvoice(window.lastOrderInvoiceData, true); } else { window.print(); }
      } else {
        window.print();
      }
    }
  </script>
</body>
</html>
